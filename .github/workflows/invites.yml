name: Ring invites

# find: search GitHub and add new candidates as "pending" (nobody is emailed).
# send: email candidates an owner has approved (status = 'approved' in Studio), once each.
# Scheduled runs only find; sending is always a manual run.
on:
    schedule:
        - cron: "0 15 1 * *" # 1st of each month
    workflow_dispatch:
        inputs:
            step:
                description: "find adds pending candidates; dry-run counts approved ones; send emails them"
                type: choice
                options: [find, dry-run, send]
                default: find

permissions:
    contents: read

jobs:
    invites:
        runs-on: ubuntu-latest
        env:
            CRON_SECRET: ${{ secrets.CRON_SECRET }}
            STEP: ${{ inputs.step || 'find' }}
        steps:
            - uses: actions/checkout@v4
              if: env.STEP == 'find'

            - uses: actions/setup-node@v4
              if: env.STEP == 'find'
              with:
                  node-version-file: .nvmrc

            # Output is counts only: this log is public
            - name: Find candidates on GitHub
              if: env.STEP == 'find'
              env:
                  # The default token allows ~1000 profile lookups an hour; a fine-grained PAT
                  # (public read-only) in INVITES_GITHUB_TOKEN raises that to 5000
                  GITHUB_TOKEN: ${{ secrets.INVITES_GITHUB_TOKEN || github.token }}
              run: node scripts/find-invite-candidates.mjs

            - name: Email approved candidates
              if: env.STEP != 'find'
              run: |
                  curl --fail-with-body -sS -X POST \
                    -H "Authorization: Bearer $CRON_SECRET" \
                    "https://uoftwebring.com/api/cron/invites?mode=$STEP"
