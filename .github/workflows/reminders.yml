name: Profile reminders

# Emails each member at most once every 8 months (the database enforces the interval).
# Scheduled runs are dry runs until the repo variable REMINDERS_ENABLED is set to "true".
on:
    schedule:
        - cron: "0 15 * * 1" # Mondays, 10–11am Toronto
    workflow_dispatch:
        inputs:
            mode:
                description: "dry-run only counts who is due; send emails them"
                type: choice
                options: [dry-run, send]
                default: dry-run

permissions: {}

# Never two runs at once (schedule + manual dispatch); the second waits
concurrency:
    group: reminders
    cancel-in-progress: false

jobs:
    remind:
        runs-on: ubuntu-latest
        steps:
            - name: Call the reminders endpoint
              env:
                  CRON_SECRET: ${{ secrets.CRON_SECRET }}
                  MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (vars.REMINDERS_ENABLED == 'true' && 'send' || 'dry-run') }}
              # The response holds counts only, never emails: this log is public
              run: |
                  curl --fail-with-body -sS -X POST \
                    -H "Authorization: Bearer $CRON_SECRET" \
                    "https://uoftwebring.com/api/cron/reminders?mode=$MODE"
